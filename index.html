<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143b35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nihongo"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Nihongo Révisions</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#173d34;background:#f3f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:18px 17px 110px}h1{font-size:27px}h2{font-size:21px}button,select,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:13px 15px;background:#146b55;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e2eee7;color:#174a3a}button.ghost{background:white;color:#184b3c;border:1px solid #cbded2}.card{background:white;border:1px solid #dce9e0;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #143b3508}.muted{color:#667b73}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.big{font-size:32px;font-weight:800}.jp{font-size:29px;line-height:1.65;overflow-wrap:anywhere}.options{display:grid;gap:9px}.options button{text-align:left;background:#f0f6f2;color:#1c4839;border:1px solid #d8e7dd}.options button.selected{border:2px solid #168165;background:#d9f0e5}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7e4dc;display:flex;justify-content:center;gap:5px;padding:9px 8px max(12px,env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:#44665a;font-size:12px;flex:1;max-width:140px;padding:9px 3px}nav button.active{background:#e1f0e8;color:#115e48}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{border-radius:999px;background:#e8f1eb;padding:5px 10px;font-size:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #c7d9ce;border-radius:12px;background:white;margin:7px 0}input[type=file]{font-size:13px}textarea{min-height:105px}label{display:block;font-weight:600;margin-top:12px}details{margin:12px 0}summary{cursor:pointer}#notice{position:fixed;top:10px;left:5%;right:5%;background:#123d30;color:white;padding:12px;border-radius:12px;display:none;z-index:20;text-align:center}ruby rt{font-size:11px;color:#657e70}.progress{height:8px;border-radius:10px;background:#dcebe2;overflow:hidden}.progress span{display:block;background:#178268;height:100%}</style></head><body><div id="notice"></div><main id="app"></main><nav id="nav"></nav><script>
'use strict';
const DBNAME='nihongo-private-v2',STORE='data';let db,items=[],progress={},history=[],settings={daily:20},tab='home',session=[],idx=0,revealed=false,selected='',mode='recognition',filter='all';
const $=s=>document.querySelector(s);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>localDate(new Date());const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const addDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return localDate(d)};const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
function notice(s){$('#notice').textContent=s;$('#notice').style.display='block';setTimeout(()=>$('#notice').style.display='none',2800)}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function get(k){return new Promise(ok=>{let r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result)})}function put(k,v){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function save(){await Promise.all([put('items',items),put('progress',progress),put('history',history),put('settings',settings)])}
const seed=[{type:'grammar',term:'〜ようになる',reading:'',meaning:'en venir à / devenir capable de',example:'漢字が読めるようになりました。',translation:'Je suis devenu capable de lire les kanji.'},{type:'grammar',term:'〜ようにする',meaning:"faire en sorte de / prendre l’habitude de",example:'毎日勉強するようにしています。',translation:"J'essaie d'étudier tous les jours."},{type:'grammar',term:'〜ために',meaning:'afin de (objectif volontaire)',example:'日本へ行くために勉強しています。',translation:"J'étudie pour aller au Japon."},{type:'grammar',term:'〜おかげで',meaning:'grâce à',example:'先生のおかげで分かりました。',translation:"J'ai compris grâce au professeur."},{type:'grammar',term:'〜ことになる',meaning:'il a été décidé que',example:'旅行は中止することになりました。',translation:'Il a été décidé d’annuler le voyage.'},{type:'vocab',term:'出張',reading:'しゅっちょう',meaning:'déplacement professionnel',example:'来週、東京へ出張します。'},{type:'vocab',term:'中止',reading:'ちゅうし',meaning:'annulation / interruption',example:'旅行が中止になりました。'},{type:'kanji',term:'学',reading:'ガク / まなぶ',meaning:'étudier, apprendre',example:'学校（がっこう）'}].map((x,i)=>({...x,id:'DEMO-'+i}));
function parseTxt(text,type){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());let out=[];for(let i=0;i<lines.length;i++){let p=lines[i].split('|').map(x=>x.trim());if(p.length<4||/^(Thème|Kanji \||Kanji$|\d+\s*\|)/.test('') )continue;let x;if(type==='grammar'){if(!/^\d+$/.test(p[0])||p.length<6)continue;x={type,term:p[1],reading:p[2],meaning:p[3],example:p[4],translation:p[5]}}else if(type==='vocab'){if(p[0]==='Thème'||p.length<5)continue;x={type,theme:p[0],term:p[1],reading:p[2],meaning:p[3],example:p[4],sourceStatus:p[5]||''}}else{if(p[0]==='Kanji'||p.length<6)continue;x={type,term:p[0],on:p[1],kun:p[2],reading:[p[1],p[2]].filter(Boolean).join(' / '),meaning:p[3],example:p[4]+' ; '+p[5]}}if(!x.term||!x.meaning)continue;x.id=type+'-'+(i+1)+'-'+x.term;out.push(x)}return out}
function dedup(a){let m=new Map();for(let x of a){let k=x.type+'|'+x.term;if(!m.has(k))m.set(k,x)}return [...m.values()]}
function due(x){let p=progress[x.id];return !p||!p.next||p.next<=today()}function status(x){let p=progress[x.id];if(!p)return 'Non étudié';return p.production>=3?'Maîtrisé en production':p.recognition>=3?'Reconnu':p.importedStatus||'À revoir'}
function render(){const tabs=[['home','Accueil','⌂'],['review','Réviser','◉'],['catalog','Catalogue','本'],['stats','Progrès','▥'],['settings','Réglages','⚙']];$('#nav').innerHTML=tabs.map(([id,name,ico])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${ico}<br>${name}</button>`).join('');let a=$('#app');if(tab==='home'){let n=items.filter(due).length;a.innerHTML=`<h1>日本語 · Révisions</h1><p class="muted">Ton japonais, à ton rythme et en privé.</p><div class="grid"><div class="card"><div class="big">${items.length}</div><div class="small muted">Notions dans le catalogue</div></div><div class="card"><div class="big">${n}</div><div class="small muted">À réviser aujourd'hui</div></div></div><div class="card"><h2>Ta séance du jour</h2><p>Révisions espacées, reconnaissance et production.</p><button onclick="start('all')">Commencer · ${settings.daily} questions</button></div><div class="card"><h2>Choisir un domaine</h2><div class="grid"><button class="secondary" onclick="start('grammar')">文法 Grammaire</button><button class="secondary" onclick="start('vocab')">単語 Vocabulaire</button><button class="secondary" onclick="start('kanji')">漢字 Kanji</button><button class="secondary" onclick="go('catalog')">Tout consulter</button></div></div>`}
else if(tab==='review'){if(!session.length){a.innerHTML='<h1>Révisions</h1><div class="card">Aucune séance en cours.<br><br><button onclick="start(\'all\')">Démarrer</button></div>';return}if(idx>=session.length){a.innerHTML=`<h1>Séance terminée 🎉</h1><div class="card"><p>${session.length} questions terminées. Les prochaines dates de révision sont enregistrées sur ton iPhone.</p><button onclick="start('all')">Nouvelle séance</button></div>`;return}let x=session[idx],p=progress[x.id]||{},choices=shuffle(items.filter(y=>y.type===x.type&&y.id!==x.id&&y.meaning!==x.meaning)).slice(0,3).map(y=>y.meaning).concat([x.meaning]);if(!window._questionChoices||window._questionId!==idx){window._questionChoices=shuffle(choices);window._questionId=idx}a.innerHTML=`<div class="row"><h1>Révision ${idx+1}/${session.length}</h1><span class="pill">${x.type==='grammar'?'Grammaire':x.type==='vocab'?'Vocabulaire':'Kanji'}</span></div><div class="progress"><span style="width:${100*idx/session.length}%"></span></div><div class="card"><div class="jp">${escapeHTML(x.term)}</div>${x.reading?`<p class="muted">${escapeHTML(x.reading)}</p>`:''}<p>Que signifie cette notion ?</p>${!revealed?`<div class="options">${window._questionChoices.map((c,i)=>`<button onclick="choose(${i})" class="${selected===c?'selected':''}">${escapeHTML(c)}</button>`).join('')}</div><p><button class="secondary" onclick="showAnswer()">Afficher la correction</button></p>`:`<p><strong>Réponse :</strong> ${escapeHTML(x.meaning)}</p>${x.example?`<p class="jp" style="font-size:21px">${escapeHTML(x.example)}</p>`:''}${x.translation?`<p>${escapeHTML(x.translation)}</p>`:''}<p class="small muted">Ces boutons évaluent uniquement la reconnaissance. La maîtrise en production doit être confirmée séparément.</p><div class="grid"><button class="secondary" onclick="grade(0)">À revoir</button><button class="secondary" onclick="grade(1)">Difficile</button><button onclick="grade(2)">Reconnu</button><button onclick="grade(3)">Facile</button></div>`}</div><div class="card"><details><summary>Production écrite (autoévaluation)</summary><p>Écris une phrase japonaise utilisant cette notion. Compare-la ensuite avec l'exemple ci-dessus.</p><textarea id="production" placeholder="Écris en japonais..."></textarea><p class="small muted">Pas de correction automatique par IA. Compare ta phrase à l'exemple puis valide uniquement si tu l'as produite sans aide.</p><button onclick="markProduction()" class="secondary">J'ai réussi en production</button></details></div>`}
else if(tab==='catalog'){let pool=items.filter(x=>filter==='all'||x.type===filter);let q=window.catalogQuery||'';pool=pool.filter(x=>(x.term+' '+x.meaning+' '+(x.reading||'')).toLowerCase().includes(q.toLowerCase()));a.innerHTML=`<h1>Catalogue complet</h1><p class="muted">${items.length} notions chargées</p><input id="search" placeholder="Rechercher en japonais ou en français" value="${escapeHTML(q)}" oninput="window.catalogQuery=this.value;render()"><select onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>Toutes les notions</option><option value="grammar" ${filter==='grammar'?'selected':''}>Grammaire</option><option value="vocab" ${filter==='vocab'?'selected':''}>Vocabulaire</option><option value="kanji" ${filter==='kanji'?'selected':''}>Kanji</option></select><p>${pool.length} résultats (affichage des 150 premiers ; utilise la recherche pour accéder aux autres)</p>${pool.slice(0,150).map(x=>`<div class="card"><div class="row"><strong class="jp" style="font-size:23px">${escapeHTML(x.term)}</strong><span class="pill">${status(x)}</span></div><p>${escapeHTML(x.reading||'')} — ${escapeHTML(x.meaning)}</p><details><summary>Exemple et détails</summary><p>${escapeHTML(x.example||'')}</p><p>${escapeHTML(x.translation||'')}</p></details></div>`).join('')}`}
else if(tab==='stats'){let counts={grammar:0,vocab:0,kanji:0},seen=0,mastered=0;items.forEach(x=>{counts[x.type]++;if(progress[x.id])seen++;if((progress[x.id]?.production||0)>=3)mastered++});a.innerHTML=`<h1>Progression</h1><div class="grid"><div class="card"><div class="big">${seen}</div><p class="muted small">Notions travaillées</p></div><div class="card"><div class="big">${mastered}</div><p class="muted small">Maîtrisées en production</p></div></div><div class="card"><h2>Référentiel</h2><p>Grammaire : ${counts.grammar}</p><p>Vocabulaire : ${counts.vocab}</p><p>Kanji : ${counts.kanji}</p></div><div class="card"><h2>Historique</h2>${history.slice(-20).reverse().map(h=>`<p class="small">${escapeHTML(h.date)} · ${escapeHTML(h.term)} · ${['À revoir','Difficile','Reconnu','Facile'][h.grade]}</p>`).join('')||'<p>Aucune réponse enregistrée.</p>'}</div>`}
else{a.innerHTML=`<h1>Réglages et confidentialité</h1><div class="card"><h2>Importer les référentiels</h2><p>Importe tes fichiers TXT originaux. Les données restent dans le stockage local de l'iPhone.</p><label>Grammaire JLPT3.txt<input type="file" accept=".txt,text/plain" onchange="importFile(this,'grammar')"></label><label>Vocabulaire JLPT3.txt<input type="file" accept=".txt,text/plain" onchange="importFile(this,'vocab')"></label><label>Kanji JLPT3.txt<input type="file" accept=".txt,text/plain" onchange="importFile(this,'kanji')"></label><p class="small muted">Les imports remplacent le catalogue de la catégorie concernée, sans effacer les autres catégories.</p></div><div class="card"><h2>Séances</h2><label>Questions par séance<input type="number" min="5" max="100" value="${settings.daily}" onchange="settings.daily=Math.max(5,Math.min(100,Number(this.value)||20));save()"></label></div><div class="card"><h2>Sauvegarde et restauration</h2><p class="small muted">Sauvegarde chiffrée AES-GCM protégée par un mot de passe. Sans ce mot de passe, la restauration est impossible.</p><button onclick="encryptedBackup()">Exporter une sauvegarde chiffrée</button><label>Restaurer une sauvegarde<input type="file" accept=".json,.nhg,application/json" onchange="restoreEncrypted(this)"></label></div><div class="card"><h2>Vie privée</h2><p>Pas de compte, de publicité, de traceur ni de transfert de réponses. Les données sont dans IndexedDB sur cet appareil. Une suppression des données Safari peut les effacer.</p><button class="ghost" onclick="if(confirm('Effacer toutes les réponses et la progression ?')){progress={};history=[];save().then(render)}">Réinitialiser la progression</button></div>`}}
function go(t){tab=t;render();scrollTo(0,0)}function start(type){let pool=items.filter(x=>type==='all'||x.type===type);let ready=shuffle(pool.filter(due));let later=shuffle(pool.filter(x=>!due(x)));session=ready.concat(later).slice(0,settings.daily);idx=0;revealed=false;selected='';window._questionId=-1;go('review')}function choose(i){selected=window._questionChoices[i];revealed=true;render()}function showAnswer(){revealed=true;render()}async function grade(g){let x=session[idx],p=progress[x.id]||{recognition:0,production:0,interval:0};p.recognition=g>=2?(p.recognition||0)+1:0;if(g===3)p.recognition=Math.max(p.recognition,3);if(g===0)p.production=0;p.interval=g===0?1:g===1?2:g===2?Math.max(3,Math.round((p.interval||2)*1.7)):Math.max(5,Math.round((p.interval||3)*2.2));p.next=addDays(p.interval);p.last=today();progress[x.id]=p;history.push({id:x.id,term:x.term,date:new Date().toISOString(),grade:g});await save();idx++;revealed=false;selected='';render()}
async function importFile(el,type){let f=el.files[0];if(!f)return;let parsed=parseTxt(await f.text(),type);if(!parsed.length){notice('Format non reconnu. Vérifie le fichier TXT.');return}items=dedup(items.filter(x=>x.type!==type).concat(parsed));await save();notice(parsed.length+' entrées importées');render()}
function backup(){let obj={format:'nihongo-v2',created:new Date().toISOString(),items,progress,history,settings};let blob=new Blob([JSON.stringify(obj)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nihongo-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}async function restore(el){try{let data=JSON.parse(await el.files[0].text());if(data.format!=='nihongo-v2'||!Array.isArray(data.items)||typeof data.progress!=='object')throw Error('Format invalide');if(!confirm('Remplacer les données locales par cette sauvegarde ?'))return;items=data.items;progress=data.progress;history=data.history||[];settings=data.settings||{daily:20};await save();render();notice('Sauvegarde restaurée')}catch(e){notice('Impossible de restaurer ce fichier')}}

async function markProduction(){if(!session.length||idx>=session.length)return;let x=session[idx];let p=progress[x.id]||{recognition:0,production:0,interval:0};p.production=(p.production||0)+1;p.last=today();progress[x.id]=p;history.push({id:x.id,term:x.term,date:new Date().toISOString(),grade:3,kind:'production'});await save();notice('Production validée · '+p.production+'/3');}
const enc=new TextEncoder(),dec=new TextDecoder();
function toB64(u){let str='';for(let i=0;i<u.length;i+=8192)str+=String.fromCharCode(...u.slice(i,i+8192));return btoa(str)}
function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(password,salt){let key=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptedBackup(){try{let pass=prompt('Choisis un mot de passe de sauvegarde (12 caractères minimum)');if(pass===null)return;if(pass.length<12){notice('Mot de passe trop court');return}let confirmPass=prompt('Confirme le mot de passe');if(pass!==confirmPass){notice('Les mots de passe ne correspondent pas');return}let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(pass,salt);let payload={format:'nihongo-v2',created:new Date().toISOString(),items,progress,history,settings};let encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(payload))));let blob=new Blob([JSON.stringify({format:'nihongo-encrypted-v1',salt:toB64(salt),iv:toB64(iv),data:toB64(encrypted)})],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='nihongo-prive-'+today()+'.nhg';a.click();setTimeout(()=>URL.revokeObjectURL(u),20000);notice('Sauvegarde chiffrée créée')}catch(e){notice('Échec du chiffrement : vérifie HTTPS et Safari')}}
async function restoreEncrypted(el){try{let file=el.files?.[0];if(!file)return;let obj=JSON.parse(await file.text()),data;if(obj.format==='nihongo-encrypted-v1'){let pass=prompt('Mot de passe de cette sauvegarde');if(pass===null)return;let key=await derive(pass,fromB64(obj.salt));let plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(obj.iv)},key,fromB64(obj.data));data=JSON.parse(dec.decode(plaintext))}else if(obj.format==='nihongo-v2'){if(!confirm('Cette sauvegarde JSON est non chiffrée. La restaurer ?'))return;data=obj}else throw Error('Format invalide');if(!Array.isArray(data.items)||!data.progress||typeof data.progress!=='object')throw Error('Données invalides');if(!confirm('Remplacer la progression et le catalogue locaux ?'))return;items=data.items;progress=data.progress;history=Array.isArray(data.history)?data.history:[];settings=data.settings||{daily:20};await save();render();notice('Restauration réussie')}catch(e){notice('Restauration impossible : mot de passe ou fichier incorrect')}}

(async()=>{try{await openDB();items=await get('items');if(!items||items.length<50){let response=await fetch('./catalog.json');if(!response.ok)throw Error('Catalogue introuvable');let full=await response.json();items=full;let old=await get('progress')||{};progress={...old};}else{progress=await get('progress')||{};}history=await get('history')||[];settings=await get('settings')||{daily:20};await save();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#app').innerHTML='<h2>Stockage indisponible</h2><p>Autorise le stockage de sites dans Safari puis recharge cette page.</p>'}})();
</script></body></html>
