<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143b35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nihongo"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Nihongo Révisions</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#173d34;background:#f3f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:18px 17px 110px}h1{font-size:27px}h2{font-size:21px}button,select,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:13px 15px;background:#146b55;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e2eee7;color:#174a3a}button.ghost{background:white;color:#184b3c;border:1px solid #cbded2}.card{background:white;border:1px solid #dce9e0;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #143b3508}.muted{color:#667b73}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.big{font-size:32px;font-weight:800}.jp{font-size:29px;line-height:1.65;overflow-wrap:anywhere}.options{display:grid;gap:9px}.options button{text-align:left;background:#f0f6f2;color:#1c4839;border:1px solid #d8e7dd}.options button.selected{border:2px solid #168165;background:#d9f0e5}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7e4dc;display:flex;justify-content:center;gap:5px;padding:9px 8px max(12px,env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:#44665a;font-size:12px;flex:1;max-width:140px;padding:9px 3px}nav button.active{background:#e1f0e8;color:#115e48}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{border-radius:999px;background:#e8f1eb;padding:5px 10px;font-size:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #c7d9ce;border-radius:12px;background:white;margin:7px 0}input[type=file]{font-size:13px}textarea{min-height:105px}label{display:block;font-weight:600;margin-top:12px}details{margin:12px 0}summary{cursor:pointer}#notice{position:fixed;top:10px;left:5%;right:5%;background:#123d30;color:white;padding:12px;border-radius:12px;display:none;z-index:20;text-align:center}ruby rt{font-size:.44em;color:#657e70} .feedback{border-radius:13px;padding:14px;margin:12px 0;font-weight:650}.feedback.good{background:#e1f5e8;color:#155e38}.feedback.bad{background:#ffe8e8;color:#922b2b}.options button.correct{background:#dff3e5;border:2px solid #238650}.options button.incorrect{background:#ffe8e8;border:2px solid #c54848}.helper{margin-top:10px;padding:12px;border-radius:12px;background:#f2f7f4}.progress{height:8px;border-radius:10px;background:#dcebe2;overflow:hidden}.progress span{display:block;background:#178268;height:100%}</style></head><body><div id="notice"></div><main id="app"></main><nav id="nav"></nav><script>
'use strict';
const DBNAME='nihongo-private-v2',STORE='data';let db,items=[],progress={},history=[],settings={daily:20},tab='home',session=[],idx=0,revealed=false,selected='',mode='recognition',filter='all',ankiSession=[],ankiIdx=0,ankiRevealed=false,ankiType='all',furiganaOn=false,frenchOn=false,helpOn=false,quizResult=null;
const $=s=>document.querySelector(s);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>localDate(new Date());const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const addDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return localDate(d)};const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
function notice(s){$('#notice').textContent=s;$('#notice').style.display='block';setTimeout(()=>$('#notice').style.display='none',2800)}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function get(k){return new Promise(ok=>{let r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result)})}function put(k,v){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function save(){await Promise.all([put('items',items),put('progress',progress),put('history',history),put('settings',settings)])}
const seed=[{type:'grammar',term:'〜ようになる',reading:'',meaning:'en venir à / devenir capable de',example:'漢字が読めるようになりました。',translation:'Je suis devenu capable de lire les kanji.'},{type:'grammar',term:'〜ようにする',meaning:"faire en sorte de / prendre l’habitude de",example:'毎日勉強するようにしています。',translation:"J'essaie d'étudier tous les jours."},{type:'grammar',term:'〜ために',meaning:'afin de (objectif volontaire)',example:'日本へ行くために勉強しています。',translation:"J'étudie pour aller au Japon."},{type:'grammar',term:'〜おかげで',meaning:'grâce à',example:'先生のおかげで分かりました。',translation:"J'ai compris grâce au professeur."},{type:'grammar',term:'〜ことになる',meaning:'il a été décidé que',example:'旅行は中止することになりました。',translation:'Il a été décidé d’annuler le voyage.'},{type:'vocab',term:'出張',reading:'しゅっちょう',meaning:'déplacement professionnel',example:'来週、東京へ出張します。'},{type:'vocab',term:'中止',reading:'ちゅうし',meaning:'annulation / interruption',example:'旅行が中止になりました。'},{type:'kanji',term:'学',reading:'ガク / まなぶ',meaning:'étudier, apprendre',example:'学校（がっこう）'}].map((x,i)=>({...x,id:'DEMO-'+i}));
function parseTxt(text,type){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());let out=[];for(let i=0;i<lines.length;i++){let p=lines[i].split('|').map(x=>x.trim());if(p.length<4||/^(Thème|Kanji \||Kanji$|\d+\s*\|)/.test('') )continue;let x;if(type==='grammar'){if(!/^\d+$/.test(p[0])||p.length<6)continue;x={type,term:p[1],reading:p[2],meaning:p[3],example:p[4],translation:p[5]}}else if(type==='vocab'){if(p[0]==='Thème'||p.length<5)continue;x={type,theme:p[0],term:p[1],reading:p[2],jlpt:p.length>=7?(p[3]==='N5'||p[3]==='N4'?p[3]:'N3'):'N3',meaning:p.length>=7?p[4]:p[3],example:p.length>=7?p[5]:p[4],sourceStatus:(p.length>=7?p[6]:p[5])||''}}else{if(p[0]==='Kanji'||p.length<6)continue;x={type,term:p[0],jlpt:p.length>=7?(p[1]==='N5'||p[1]==='N4'?p[1]:'N3'):'N3',on:p.length>=7?p[2]:p[1],kun:p.length>=7?p[3]:p[2],reading:[p.length>=7?p[2]:p[1],p.length>=7?p[3]:p[2]].filter(Boolean).join(' / '),meaning:p.length>=7?p[4]:p[3],example:(p.length>=7?p[5]:p[4])+' ; '+(p.length>=7?p[6]:p[5])}}if(!x.term||!x.meaning)continue;x.jlpt=x.jlpt||'N3';x.id=type+'-'+(i+1)+'-'+x.term;out.push(x)}return out}
function dedup(a){let m=new Map();for(let x of a){let k=x.type+'|'+x.term;if(!m.has(k))m.set(k,x)}return [...m.values()]}
function due(x){let p=progress[x.id];return !p||!p.next||p.next<=today()}function status(x){let p=progress[x.id];if(!p)return 'Non étudié';return p.production>=3?'Maîtrisé en production':p.recognition>=3?'Reconnu':p.importedStatus||'À revoir'}

const jpDefinitions={
 '予定':'これからすることや、することが決まっていること。',
 '中止':'する予定だったことを、途中でやめたり、しないことにしたりすること。',
 '出張':'仕事のために、いつもの職場とは違う場所へ行くこと。',
 '練習':'上手になるために、何度もやってみること。',
 '〜すぎる':'程度が普通より大きいことを表します。',
 '〜ようになる':'前はできなかったことが、できるようになる変化を表します。',
 '〜ようにする':'目標のために、意識して続けることを表します。',
 '〜ために':'何かをする目的を表します。',
 '〜おかげで':'よい結果になった理由を表します。',
 '〜ことになる':'自分だけではなく、事情や決定によってそうなることを表します。'
};
const jpReadingPairs={'景色':'けしき','海':'うみ','正解':'せいかい','不正解':'ふせいかい','答え':'こたえ','読み方':'よみかた','説明':'せつめい','登録':'とうろく','言葉':'ことば','意味':'いみ','何':'なん','予定':'よてい','中止':'ちゅうし','出張':'しゅっちょう','練習':'れんしゅう','仕事':'しごと','職場':'しょくば','場所':'ばしょ','違':'ちが','行':'い','来':'き','日本語':'にほんご','日本':'にほん','漢字':'かんじ','明日':'あした','今日':'きょう','先生':'せんせい','学生':'がくせい','学校':'がっこう','私':'わたし','猫':'ねこ','好':'す','読':'よ','勉強':'べんきょう','毎日':'まいにち','旅行':'りょこう','結果':'けっか','理由':'りゆう','目的':'もくてき','目標':'もくひょう','普通':'ふつう','程度':'ていど','大':'おお','表':'あらわ','前':'まえ','変化':'へんか','自分':'じぶん','事情':'じじょう','決定':'けってい','何度':'なんど','途中':'とちゅう','上手':'じょうず','意識':'いしき','続':'つづ','決':'き','違':'ちが','働':'はたら'};
function rubyText(raw,allow=true){let str=String(raw||'');if(!furiganaOn||!allow)return escapeHTML(str);let keys=Object.keys(jpReadingPairs).sort((a,b)=>b.length-a.length),out='';for(let i=0;i<str.length;){let key=keys.find(k=>str.startsWith(k,i));if(key){out+='<ruby>'+escapeHTML(key)+'<rt>'+escapeHTML(jpReadingPairs[key])+'</rt></ruby>';i+=key.length}else{out+=escapeHTML(str[i]);i++}}return out}
function termWithFurigana(x){const t=String(x.term||''),r=String(x.reading||'').trim();if(furiganaOn&&r&&/[一-龯々]/.test(t)&&/^[ぁ-ゖァ-ヿー・\s]+$/.test(r))return '<ruby>'+escapeHTML(t)+'<rt>'+escapeHTML(r)+'</rt></ruby>';return rubyText(t)}
function helpPanel(x){let def=jpDefinitions[x.term]||(x.term==='景色'?'目で見える、山や海、町などのようす。':null);return `<div class="row"><button class="secondary" onclick="helpOn=!helpOn;render()">${helpOn?'説明を隠す':'日本語の説明'}</button><button class="ghost" onclick="frenchOn=!frenchOn;render()">${frenchOn?'Françaisを隠す':'Aide en français'}</button></div>${helpOn?`<div class="helper">${def?rubyText(def):rubyText('この言葉の日本語での説明は、まだ登録されていません。')}</div>`:''}${frenchOn?`<div class="helper"><strong>Français :</strong> ${escapeHTML(x.meaning)}${x.translation?`<p>${escapeHTML(x.translation)}</p>`:''}</div>`:''}`}
function furiganaControl(){return `<button class="ghost" onclick="furiganaOn=!furiganaOn;settings.furigana=furiganaOn;save();render()">ふりがな ${furiganaOn?'ON':'OFF'}</button>`}

function render(){const tabs=[['home','Accueil','⌂'],['review','Réviser','◉'],['anki','Anki','▣'],['catalog','Catalogue','本'],['stats','Progrès','▥'],['settings','Réglages','⚙']];$('#nav').innerHTML=tabs.map(([id,name,ico])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${ico}<br>${name}</button>`).join('');let a=$('#app');if(tab==='home'){let n=items.filter(due).length;a.innerHTML=`<h1>日本語 · Révisions</h1><p class="muted">Ton japonais, à ton rythme et en privé.</p><div class="grid"><div class="card"><div class="big">${items.length}</div><div class="small muted">Notions dans le catalogue</div></div><div class="card"><div class="big">${items.filter(x=>isSeen(x)&&due(x)).length}</div><div class="small muted">À réviser aujourd'hui</div></div></div><div class="card"><h2>Ta séance du jour</h2><p>Révisions espacées et nouvelles notions introduites progressivement, sans choix manuel de niveau.</p><button onclick="start('all')">Commencer · ${settings.daily} questions</button></div><div class="card"><h2>Cartes Anki</h2><p>Retourne une carte puis évalue ton souvenir. Les cartes difficiles reviennent plus tôt.</p><button onclick="startAnki('all')">Réviser avec Anki</button></div><div class="card"><h2>Choisir un domaine</h2><div class="grid"><button class="secondary" onclick="start('grammar')">文法 Grammaire</button><button class="secondary" onclick="start('vocab')">単語 Vocabulaire</button><button class="secondary" onclick="start('kanji')">漢字 Kanji</button><button class="secondary" onclick="go('catalog')">Tout consulter</button></div></div>`}
else if(tab==='review'){if(!session.length){a.innerHTML='<h1>復習 · Révisions</h1><div class="card"><button onclick="start(\'all\')">始める</button></div>';return}if(idx>=session.length){let hs=history.filter(h=>h.kind==='quiz'&&h.sessionId===window.quizSessionId);let good=hs.filter(h=>h.correct).length;a.innerHTML=`<h1>お疲れさまでした！</h1><div class="card"><h2>Score : ${good}/${hs.length}</h2><p>Les erreurs reviennent plus tôt dans les révisions.</p><button onclick="start('all')">次の復習</button></div>`;return}let x=session[idx];if(window._questionId!==idx||!window._questionChoices){let distractors=shuffle(items.filter(y=>y.type===x.type&&y.id!==x.id&&y.meaning!==x.meaning&&y.meaning)).slice(0,3).map(y=>y.meaning);window._questionChoices=shuffle([...distractors,x.meaning]);window._questionId=idx}let choices=window._questionChoices;a.innerHTML=`<div class="row"><h1>復習 ${idx+1}/${session.length}</h1>${furiganaControl()}</div><div class="progress"><span style="width:${100*idx/session.length}%"></span></div><div class="card"><div class="jp">${termWithFurigana(x)}</div><p>${rubyText('この言葉の意味は何ですか。')}</p><div class="options">${choices.map((c,i)=>`<button ${quizResult?'disabled':''} onclick="choose(${i})" class="${quizResult?(c===x.meaning?'correct':i===quizResult.choice?'incorrect':''):''}">${String.fromCharCode(65+i)}. ${escapeHTML(c)}</button>`).join('')}</div>${quizResult?`<div class="feedback ${quizResult.correct?'good':'bad'}">${quizResult.correct?'✓ 正解（せいかい） · Bonne réponse':'✕ 不正解（ふせいかい） · Mauvaise réponse'}</div><p><strong>正しい答え :</strong> ${escapeHTML(x.meaning)}</p>${x.reading?`<p>${rubyText('読み方')} : ${furiganaOn?`<ruby>${escapeHTML(x.term)}<rt>${escapeHTML(x.reading)}</rt></ruby>`:escapeHTML(x.term)}（${escapeHTML(x.reading)}）</p>`:''}${x.example?`<p class="jp" style="font-size:21px">${rubyText(x.example.split(/[=＝]/)[0].trim())}</p>`:''}${helpPanel(x)}<p><button onclick="nextQuiz()">次の問題 →</button></p>`:''}</div>`}
else if(tab==='anki'){if(!ankiSession.length){a.innerHTML=`<h1>Cartes Anki</h1><div class="card"><p>Choisis les cartes à réviser. Réponds mentalement avant de retourner la carte.</p><div class="grid"><button onclick="startAnki('all')">Tout</button><button class="secondary" onclick="startAnki('grammar')">Grammaire</button><button class="secondary" onclick="startAnki('vocab')">Vocabulaire</button><button class="secondary" onclick="startAnki('kanji')">Kanji</button></div></div>`;return}if(ankiIdx>=ankiSession.length){a.innerHTML=`<h1>Séance Anki terminée 🎉</h1><div class="card"><p>${ankiSession.length} cartes révisées. Les prochaines échéances sont enregistrées localement.</p><button onclick="startAnki(ankiType)">Nouvelle séance</button></div>`;return}let x=ankiSession[ankiIdx];let next=progress[x.id]?.next;let reading=x.reading||'';a.innerHTML=`<div class="row"><h1>Anki ${ankiIdx+1}/${ankiSession.length}</h1>${furiganaControl()}<span class="pill">${x.type==='kanji'?'Kanji':x.type==='grammar'?'Grammaire':'Vocabulaire'}</span></div><div class="progress"><span style="width:${100*ankiIdx/ankiSession.length}%"></span></div><div class="card"><p class="muted small">${ankiRevealed?'VERSO · CORRECTION':'RECTO · RETROUVE LE SENS ET LA LECTURE'}</p><div class="jp" style="font-size:44px;text-align:center;padding:24px 0">${escapeHTML(x.term)}</div>${!ankiRevealed?`<button style="width:100%" onclick="ankiRevealed=true;render()">Retourner la carte</button>`:`<div style="border-top:1px solid #dce9e0;padding-top:14px"><p><strong>Lecture :</strong> ${escapeHTML(reading||'—')}</p><p><strong>意味 :</strong> ${jpDefinitions[x.term]?rubyText(jpDefinitions[x.term]):'日本語の説明はまだありません。'}</p>${x.example?`<p class="jp" style="font-size:20px">${rubyText(x.example)}</p>`:''}${helpPanel(x)}</div><p class="muted small">Comment t'en es-tu souvenu ? Autoévaluation : la réponse n'est pas vérifiée automatiquement.</p><div class="grid"><button class="secondary" onclick="ankiGrade(0)">À revoir</button><button class="secondary" onclick="ankiGrade(1)">Difficile</button><button onclick="ankiGrade(2)">Correct</button><button onclick="ankiGrade(3)">Facile</button></div>`}</div><p class="muted small">Le mode Anki mesure le rappel, pas la maîtrise en production écrite.</p>`}
else if(tab==='catalog'){let pool=items.filter(x=>(filter==='all'||x.type===filter));let q=window.catalogQuery||'';pool=pool.filter(x=>(x.term+' '+x.meaning+' '+(x.reading||'')).toLowerCase().includes(q.toLowerCase()));a.innerHTML=`<h1>Catalogue complet</h1>${furiganaControl()}<p class="muted">${items.length} notions chargées</p><input id="search" placeholder="Rechercher en japonais ou en français" value="${escapeHTML(q)}" oninput="window.catalogQuery=this.value;window.catalogLimit=50;render()"><select onchange="filter=this.value;window.catalogLimit=50;render()"><option value="all" ${filter==='all'?'selected':''}>Toutes les notions</option><option value="grammar" ${filter==='grammar'?'selected':''}>Grammaire</option><option value="vocab" ${filter==='vocab'?'selected':''}>Vocabulaire</option><option value="kanji" ${filter==='kanji'?'selected':''}>Kanji</option></select><p>${pool.length} résultats · ${Math.min(pool.length,window.catalogLimit||50)} affichés</p>${pool.slice(0,window.catalogLimit||50).map(x=>`<div class="card"><div class="row"><strong class="jp" style="font-size:23px">${termWithFurigana(x)}</strong><span class="pill">${x.jlpt?escapeHTML(x.jlpt)+' · ':''}${status(x)}</span></div><p>${escapeHTML(x.reading||'')} — ${escapeHTML(x.meaning)}</p><details><summary>Exemple et détails</summary><p>${rubyText(x.example||'')}</p><p>${escapeHTML(x.translation||'')}</p></details></div>`).join('')}${pool.length>(window.catalogLimit||50)?`<button style="width:100%" onclick="window.catalogLimit=(window.catalogLimit||50)+50;render()">Afficher 50 fiches supplémentaires (${pool.length-Math.min(pool.length,window.catalogLimit||50)} restantes)</button>`:''}`}
else if(tab==='stats'){let counts={grammar:0,vocab:0,kanji:0},seen=0,mastered=0;items.forEach(x=>{counts[x.type]++;if(progress[x.id])seen++;if((progress[x.id]?.production||0)>=3)mastered++});a.innerHTML=`<h1>Progression</h1><div class="grid"><div class="card"><div class="big">${seen}</div><p class="muted small">Notions travaillées</p></div><div class="card"><div class="big">${mastered}</div><p class="muted small">Maîtrisées en production</p></div></div><div class="card"><h2>Référentiel</h2><p>Grammaire : ${counts.grammar}</p><p>Vocabulaire : ${counts.vocab}</p><p>Kanji : ${counts.kanji}</p></div><div class="card"><h2>Historique</h2>${history.slice(-20).reverse().map(h=>`<p class="small">${escapeHTML(h.date)} · ${escapeHTML(h.term)} · ${['À revoir','Difficile','Reconnu','Facile'][h.grade]}${h.kind==='anki'?' · Anki':''}</p>`).join('')||'<p>Aucune réponse enregistrée.</p>'}</div>`}
else{a.innerHTML=`<h1>Réglages et confidentialité</h1><div class="card"><h2>Importer les référentiels</h2><p>Importe tes fichiers TXT originaux. Les données restent dans le stockage local de l'iPhone.</p><label>Grammaire JLPT3.txt<input type="file" accept=".txt,text/plain" onchange="importFile(this,'grammar')"></label><label>Vocabulaire JLPT3.txt<input type="file" accept=".txt,text/plain" onchange="importFile(this,'vocab')"></label><label>Kanji JLPT3.txt<input type="file" accept=".txt,text/plain" onchange="importFile(this,'kanji')"></label><p class="small muted">Les imports remplacent le catalogue de la catégorie concernée, sans effacer les autres catégories.</p></div><div class="card"><h2>Séances</h2><label>Questions par séance<input type="number" min="5" max="100" value="${settings.daily}" onchange="settings.daily=Math.max(5,Math.min(100,Number(this.value)||20));save()"></label></div><div class="card"><h2>Sauvegarde et restauration</h2><p class="small muted">Sauvegarde chiffrée AES-GCM protégée par un mot de passe. Sans ce mot de passe, la restauration est impossible.</p><button onclick="encryptedBackup()">Exporter une sauvegarde chiffrée</button><label>Restaurer une sauvegarde<input type="file" accept=".json,.nhg,application/json" onchange="restoreEncrypted(this)"></label></div><div class="card"><h2>Synchronisation manuelle · Google Drive</h2><p>Cette version utilise un transfert de fichier que tu déclenches toi-même : aucune connexion automatique à Google Drive.</p><p><strong>1.</strong> Exporte ta progression, puis enregistre le fichier dans Google Drive depuis la feuille de partage de ton iPhone.</p><button onclick="exportProgress()">Exporter ma progression (CSV)</button><p><strong>2.</strong> Pour récupérer des données, télécharge depuis Google Drive un fichier CSV ou JSON compatible, puis importe-le ici. Les données sont fusionnées sans supprimer tes résultats actuels.</p><label>Importer une progression<input type="file" accept=".csv,.json,text/csv,application/json" onchange="importProgress(this)"></label><p class="small muted">Colonnes CSV : type, terme, statut, reconnaissance, production, prochaine_revision. Valeurs de type : grammar, vocab, kanji. Statuts : vu, reconnu, maitrise. Une sauvegarde chiffrée reste recommandée avant toute importation.</p></div><div class="card"><h2>Vie privée</h2><p>Pas de compte, de publicité, de traceur ni de transfert de réponses. Les données sont dans IndexedDB sur cet appareil. Une suppression des données Safari peut les effacer.</p><button class="ghost" onclick="if(confirm('Effacer toutes les réponses et la progression ?')){progress={};history=[];save().then(render)}">Réinitialiser la progression</button></div>`}}
// Progression automatique : réviser les notions vues à échéance avant d'introduire des nouveautés.
// Les notions sans niveau source sont traitées comme N3 par convention pédagogique.
function stage(x){return x.jlpt==='N5'?0:x.jlpt==='N4'?1:2}
function isSeen(x){let p=progress[x.id];return !!(p&&(p.last||p.recognition>0||p.production>0||p.importedStatus))}
function learningPool(type){let pool=items.filter(x=>type==='all'||x.type===type);
 let reviews=shuffle(pool.filter(x=>isSeen(x)&&due(x)));
 let target=Math.max(1,settings.daily);let result=reviews.slice(0,target);
 if(result.length>=target)return result;
 // Limiter les nouveautés à 20 % d'une séance et éviter de sauter les bases.
 let newLimit=Math.max(1,Math.ceil(target*.2));let newItems=pool.filter(x=>!isSeen(x));
 newItems.sort((a,b)=>{if(a.type===b.type){let level=stage(a)-stage(b);if(level)return level;if(a.type==='grammar')return (a.sourceNumber||9999)-(b.sourceNumber||9999);return 0;}return ['grammar','vocab','kanji'].indexOf(a.type)-['grammar','vocab','kanji'].indexOf(b.type)});
 result.push(...newItems.slice(0,Math.min(newLimit,target-result.length)));
 if(result.length<target)result.push(...shuffle(pool.filter(x=>isSeen(x)&&!due(x))).slice(0,target-result.length));
 return result;
}
function startAnki(type){ankiType=type;ankiSession=learningPool(type);ankiIdx=0;ankiRevealed=false;go('anki')}
async function ankiGrade(g){if(!ankiRevealed||ankiIdx>=ankiSession.length)return;let x=ankiSession[ankiIdx],p=progress[x.id]||{recognition:0,production:0,interval:0};p.recognition=g>=2?(p.recognition||0)+1:0;if(g===0)p.recognition=0;let prev=p.interval||0;p.interval=g===0?1:g===1?Math.max(1,Math.round(prev*1.2)):g===2?Math.max(2,Math.round((prev||1)*2.3)):Math.max(4,Math.round((prev||1)*3.5));p.next=addDays(p.interval);p.last=today();progress[x.id]=p;history.push({id:x.id,term:x.term,date:new Date().toISOString(),grade:g,kind:'anki'});await save();ankiIdx++;ankiRevealed=false;render()}
function go(t){tab=t;render();scrollTo(0,0)}function start(type){session=learningPool(type);idx=0;revealed=false;selected='';quizResult=null;window.quizSessionId=Date.now();window._questionId=-1;go('review')}async function choose(i){if(quizResult)return;let x=session[idx],answer=window._questionChoices[i],correct=answer===x.meaning,p=progress[x.id]||{recognition:0,production:0,interval:0};p.recognition=correct?(p.recognition||0)+1:0;p.interval=correct?Math.max(2,Math.round((p.interval||1)*2)):1;p.next=addDays(p.interval);p.last=today();p.quizCorrect=(p.quizCorrect||0)+(correct?1:0);p.quizWrong=(p.quizWrong||0)+(correct?0:1);progress[x.id]=p;history.push({id:x.id,term:x.term,date:new Date().toISOString(),grade:correct?2:0,kind:'quiz',correct,sessionId:window.quizSessionId});quizResult={choice:i,correct};await save();render()}function nextQuiz(){idx++;quizResult=null;frenchOn=false;helpOn=false;render()}async function grade(g){let x=session[idx],p=progress[x.id]||{recognition:0,production:0,interval:0};p.recognition=g>=2?(p.recognition||0)+1:0;if(g===3)p.recognition=Math.max(p.recognition,3);if(g===0)p.production=0;p.interval=g===0?1:g===1?2:g===2?Math.max(3,Math.round((p.interval||2)*1.7)):Math.max(5,Math.round((p.interval||3)*2.2));p.next=addDays(p.interval);p.last=today();progress[x.id]=p;history.push({id:x.id,term:x.term,date:new Date().toISOString(),grade:g});await save();idx++;revealed=false;selected='';render()}
async function importFile(el,type){let f=el.files[0];if(!f)return;let parsed=parseTxt(await f.text(),type);if(!parsed.length){notice('Format non reconnu. Vérifie le fichier TXT.');return}items=dedup(items.filter(x=>x.type!==type).concat(parsed));await save();notice(parsed.length+' entrées importées');render()}
function csvCell(v){let t=String(v??'');return '"'+t.replace(/"/g,'""')+'"'}
function downloadFile(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),20000)}
function exportProgress(){let rows=[['type','terme','statut','reconnaissance','production','prochaine_revision','derniere_revision']];for(let x of items){let p=progress[x.id];if(!p)continue;rows.push([x.type,x.term,p.production>=3?'maitrise':p.recognition>=3?'reconnu':p.importedStatus||'vu',p.recognition||0,p.production||0,p.next||'',p.last||''])}downloadFile('nihongo-progression-'+today()+'.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');notice(rows.length-1+' entrées exportées · enregistre le fichier sur Drive')}
function parseCSV(t){let sep=t.split(/\r?\n/,1)[0].includes(';')?';':',';let rows=[],r=[],v='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(x=>x.trim()))rows.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(x=>x.trim()))rows.push(r);return rows}
function normStatus(s){s=String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(/maitris|production/.test(s))return 'maitrise';if(/reconnu|acquis/.test(s))return 'reconnu';return 'vu'}
async function importProgress(el){try{let f=el.files?.[0];if(!f)return;let raw=(await f.text()).replace(/^\uFEFF/,'');let entries;if(f.name.toLowerCase().endsWith('.json')){let o=JSON.parse(raw);if(o.format==='nihongo-progress-v1'&&Array.isArray(o.entries))entries=o.entries;else throw Error('JSON incompatible')}else{let rows=parseCSV(raw);let head=rows.shift().map(x=>x.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let col=(...names)=>head.findIndex(h=>names.includes(h));let typ=col('type','categorie'),term=col('terme','term','notion','kanji','mot'),stat=col('statut','status'),rec=col('reconnaissance','recognition'),prod=col('production'),next=col('prochaine_revision','next'),last=col('derniere_revision','last');if(typ<0||term<0)throw Error('Colonnes type et terme manquantes');entries=rows.map(r=>({type:r[typ],term:r[term],status:stat<0?'vu':r[stat],recognition:rec<0?'':r[rec],production:prod<0?'':r[prod],next:next<0?'':r[next],last:last<0?'':r[last]}))}let map=new Map(items.map(x=>[x.type+'|'+x.term,x])),changed=0,unmatched=0;for(let e of entries){let x=map.get(String(e.type||'').trim()+'|'+String(e.term||'').trim());if(!x){unmatched++;continue}let p=progress[x.id]||{recognition:0,production:0,interval:0};let status=normStatus(e.status);let rn=Number(e.recognition),pn=Number(e.production);if(Number.isFinite(rn)&&e.recognition!==''&&e.recognition!=null)p.recognition=Math.max(p.recognition||0,Math.min(100,Math.max(0,rn)));if(Number.isFinite(pn)&&e.production!==''&&e.production!=null)p.production=Math.max(p.production||0,Math.min(100,Math.max(0,pn)));if(status==='reconnu')p.recognition=Math.max(p.recognition||0,3);if(status==='maitrise')p.production=Math.max(p.production||0,3);p.importedStatus=status==='vu'?(p.importedStatus||'Vu'):status==='reconnu'?'Reconnu':'Maîtrisé en production';if(/^\d{4}-\d{2}-\d{2}$/.test(e.next||'')&&!p.next)p.next=e.next;if(/^\d{4}-\d{2}-\d{2}$/.test(e.last||'')&&!p.last)p.last=e.last;progress[x.id]=p;changed++}if(!changed)throw Error('Aucune notion correspondante');if(!confirm('Fusionner '+changed+' notions ? '+unmatched+' lignes non reconnues. Les progrès existants seront conservés.'))return;await save();render();notice(changed+' notions fusionnées, '+unmatched+' ignorées')}catch(e){alert('Importation impossible : '+e.message)}finally{if(el)el.value=''}}
function backup(){let obj={format:'nihongo-v2',created:new Date().toISOString(),items,progress,history,settings};let blob=new Blob([JSON.stringify(obj)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nihongo-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}async function restore(el){try{let data=JSON.parse(await el.files[0].text());if(data.format!=='nihongo-v2'||!Array.isArray(data.items)||typeof data.progress!=='object')throw Error('Format invalide');if(!confirm('Remplacer les données locales par cette sauvegarde ?'))return;items=data.items;progress=data.progress;history=data.history||[];settings=data.settings||{daily:20};await save();render();notice('Sauvegarde restaurée')}catch(e){notice('Impossible de restaurer ce fichier')}}

async function markProduction(){if(!session.length||idx>=session.length)return;let x=session[idx];let p=progress[x.id]||{recognition:0,production:0,interval:0};p.production=(p.production||0)+1;p.last=today();progress[x.id]=p;history.push({id:x.id,term:x.term,date:new Date().toISOString(),grade:3,kind:'production'});await save();notice('Production validée · '+p.production+'/3');}
const enc=new TextEncoder(),dec=new TextDecoder();
function toB64(u){let str='';for(let i=0;i<u.length;i+=8192)str+=String.fromCharCode(...u.slice(i,i+8192));return btoa(str)}
function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(password,salt){let key=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptedBackup(){try{let pass=prompt('Choisis un mot de passe de sauvegarde (12 caractères minimum)');if(pass===null)return;if(pass.length<12){notice('Mot de passe trop court');return}let confirmPass=prompt('Confirme le mot de passe');if(pass!==confirmPass){notice('Les mots de passe ne correspondent pas');return}let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(pass,salt);let payload={format:'nihongo-v2',created:new Date().toISOString(),items,progress,history,settings};let encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(payload))));let blob=new Blob([JSON.stringify({format:'nihongo-encrypted-v1',salt:toB64(salt),iv:toB64(iv),data:toB64(encrypted)})],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='nihongo-prive-'+today()+'.nhg';a.click();setTimeout(()=>URL.revokeObjectURL(u),20000);notice('Sauvegarde chiffrée créée')}catch(e){notice('Échec du chiffrement : vérifie HTTPS et Safari')}}
async function restoreEncrypted(el){try{let file=el.files?.[0];if(!file)return;let obj=JSON.parse(await file.text()),data;if(obj.format==='nihongo-encrypted-v1'){let pass=prompt('Mot de passe de cette sauvegarde');if(pass===null)return;let key=await derive(pass,fromB64(obj.salt));let plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(obj.iv)},key,fromB64(obj.data));data=JSON.parse(dec.decode(plaintext))}else if(obj.format==='nihongo-v2'){if(!confirm('Cette sauvegarde JSON est non chiffrée. La restaurer ?'))return;data=obj}else throw Error('Format invalide');if(!Array.isArray(data.items)||!data.progress||typeof data.progress!=='object')throw Error('Données invalides');if(!confirm('Remplacer la progression et le catalogue locaux ?'))return;items=data.items;progress=data.progress;history=Array.isArray(data.history)?data.history:[];settings=data.settings||{daily:20};await save();render();notice('Restauration réussie')}catch(e){notice('Restauration impossible : mot de passe ou fichier incorrect')}}

(async()=>{try{await openDB();items=await get('items');if(!items||items.length<50){let response=await fetch('./catalog.json');if(!response.ok)throw Error('Catalogue introuvable');let full=await response.json();items=full;let old=await get('progress')||{};progress={...old};}else{progress=await get('progress')||{};}history=await get('history')||[];settings=await get('settings')||{daily:20};furiganaOn=!!settings.furigana;try{let response=await fetch('./catalog.json',{cache:'no-store'});if(response.ok){let fresh=await response.json(),byId=new Map(fresh.map(x=>[x.id,x])),byTerm=new Map(fresh.map(x=>[x.type+'|'+x.term,x]));items=items.map(x=>{let n=byId.get(x.id)||byTerm.get(x.type+'|'+x.term);return n?{...x,jlpt:n.jlpt||'N3'}:{...x,jlpt:x.jlpt||'N3'}})}}catch(e){}await save();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#app').innerHTML='<h2>Stockage indisponible</h2><p>Autorise le stockage de sites dans Safari puis recharge cette page.</p>'}})();
